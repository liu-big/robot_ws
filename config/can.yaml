# SocketCAN — 灵足 USB_CANHUB 实际接线
#
#   can0 → 灵足 RS03 抬升 ×4，ID 1~4（内部，带麦轮连杆）
#   can1 → 灵足 RS03 拉杆 ×4，ID 5~8（外部，趴下/站起）
#   can2 → 大疆 C620 ×4 + M3508，ID 1~4（四轮麦轮）
#
# 手册:
#   USB_CANHUB: 3668968132USB_CANHUB使用说明V1.0(1).pdf
#   RS03:       product_manual_robStride03-9c54db7a.pdf
#   C620:       RoboMaster C620无刷电机调速器使用说明（中英日）V1.01.pdf

device:
  name: USB_CANHUB
  vendor: 灵足时代 RobStride
  driver: gs_usb
  channels: 5
  usb: Type-C USB2.0
  termination_120ohm: "HUB 拨码 ON=120Ω; C620 自身也有终端电阻开关"

defaults:
  bitrate: 1000000
  restart_ms: 100
  txqueuelen: 1000

buses:
  can0:
    interface: can0
    purpose: robstride_lift
    vendor: 灵足
    frame_type: extended
    motors: 4
    motor_ids: [1, 2, 3, 4]
    role: four_legs_lift
  can1:
    interface: can1
    purpose: robstride_crouch
    vendor: 灵足
    frame_type: extended
    motors: 4
    motor_ids: [5, 6, 7, 8]
    role: four_legs_crouch
  can2:
    interface: can2
    purpose: dji_c620_m3508
    vendor: 大疆 DJI
    frame_type: standard
    motors: 4
    motor_ids: [1, 2, 3, 4]
    role: four_mecanum_wheels
  can3:
    interface: can3
    purpose: spare
  can4:
    interface: can4
    purpose: spare

bringup_order:
  - can0
  - can1
  - can2

usb_topology:
  bus: "Bus 02 Port 5 (USB2.0 12Mbps)"
  mapping:
    can0: "2-5.1:1.0"   # 灵足 抬升 1~4
    can1: "2-5.2:1.0"   # 灵足 拉杆 5~8
    can2: "2-5.3:1.0"   # 大疆 C620 四轮
    can3: "2-5.5:1.0"
    can4: "2-5.6:1.0"

robstride_lift:
  interface: can0
  frame_type: extended
  host_id: 0xFF
  motors:
    - {id: 1, leg: leg1, role: lift}
    - {id: 2, leg: leg2, role: lift}
    - {id: 3, leg: leg3, role: lift}
    - {id: 4, leg: leg4, role: lift}

robstride_crouch:
  interface: can1
  frame_type: extended
  host_id: 0xFF
  motors:
    - {id: 5, leg: leg1, role: crouch}
    - {id: 6, leg: leg2, role: crouch}
    - {id: 7, leg: leg3, role: crouch}
    - {id: 8, leg: leg4, role: crouch}

dji_c620:
  interface: can2
  frame_type: standard
  bitrate: 1000000
  control_ids:
    motors_1_to_4: 0x200
    motors_5_to_8: 0x1FF
  motors:
    - {id: 1, leg: leg1, feedback_id: 0x201}
    - {id: 2, leg: leg2, feedback_id: 0x202}
    - {id: 3, leg: leg3, feedback_id: 0x203}
    - {id: 4, leg: leg4, feedback_id: 0x204}
