# 实时线程 CPU 分配 — Intel H81U / i5-4200U (2 物理核 / 4 逻辑 CPU)
#
# 拓扑:
#   物理核0: CPU0 + CPU2  (siblings 0,2)
#   物理核1: CPU1 + CPU3  (siblings 1,3)
#
# GRUB: isolcpus=2,3 nohz_full=2,3 rcu_nocbs=2,3 threadirqs

system:
  hostname: a-H81U
  cores_physical: 2
  cpus_logical: 4

cpu_map:
  linux:      [0, 1]    # 系统 / SSH / ROS2 / 网络 / 日志
  safety:     1          # SCHED_FIFO 70
  can:        2          # SCHED_FIFO 80, SocketCAN TX/RX
  servo_rt:   3          # SCHED_FIFO 90, 500 Hz 电机环

threads:
  servo_rt:
    rate_hz: 500
    period_us: 2000
    scheduler: SCHED_FIFO
    priority: 90
    cpu: 3
  can_io:
    scheduler: SCHED_FIFO
    priority: 80
    cpu: 2
  safety:
    scheduler: SCHED_FIFO
    priority: 70
    cpu: 1
  policy:
    rate_hz: 100
    cpu: 1
    language: python

cyclictest_baseline:
  kernel: 5.15.0-1032-realtime
  idle_max_us: 53
  stress_max_us: 54
